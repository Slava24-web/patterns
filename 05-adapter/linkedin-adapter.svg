<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15181f"/>
      <stop offset="1" stop-color="#23283a"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7b98"/>
      <stop offset="1" stop-color="#ff6384"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="#36a2eb">FRONTEND PATTERNS · 05 · Example: React + Chart.js</text>
  <text x="70" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Adapter Pattern</text>
  <text x="70" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#aab4c8">Your interface in, the library's API out</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- наш клиент (слева) -->
    <g filter="url(#shadow)">
      <rect x="70" y="330" width="290" height="130" rx="18" fill="#262c3d" stroke="#36a2eb" stroke-width="2"/>
    </g>
    <text x="215" y="372" text-anchor="middle" font-size="24" fill="#aab4c8">our app</text>
    <text x="215" y="412" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">SalesChart</text>
    <text x="215" y="446" text-anchor="middle" font-size="21" font-family="Menlo, monospace" fill="#ffffff">renderer.render()</text>

    <!-- стрелка -->
    <path d="M370 395 L440 395" stroke="#36a2eb" stroke-width="4" fill="none"/>

    <!-- адаптер (в центре) -->
    <g filter="url(#glow)">
      <rect x="450" y="320" width="280" height="150" rx="22" fill="url(#core)"/>
    </g>
    <rect x="450" y="320" width="280" height="150" rx="22" fill="none" stroke="#ffe3ea" stroke-width="2" stroke-opacity="0.5"/>
    <text x="590" y="362" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="2" fill="#ffe3ea">ADAPTER</text>
    <text x="590" y="410" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">ChartJsAdapter</text>
    <text x="590" y="448" text-anchor="middle" font-size="21" font-family="Menlo, monospace" fill="#fff1f4">Point[] → config</text>

    <!-- стрелка -->
    <path d="M730 395 L800 395" stroke="#36a2eb" stroke-width="4" fill="none"/>

    <!-- библиотека (справа) -->
    <g filter="url(#shadow)">
      <rect x="810" y="330" width="320" height="130" rx="18" fill="#262c3d" stroke="#36a2eb" stroke-width="2"/>
    </g>
    <text x="970" y="372" text-anchor="middle" font-size="24" fill="#aab4c8">third-party library</text>
    <text x="970" y="412" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Chart.js</text>
    <text x="970" y="446" text-anchor="middle" font-size="21" font-family="Menlo, monospace" fill="#ffffff">new Chart() · destroy()</text>

    <!-- подпись под схемой -->
    <text x="70" y="540" font-size="22" fill="#aab4c8">Swap Chart.js for another library: write a new adapter, SalesChart stays the same.</text>
  </g>
</svg>
