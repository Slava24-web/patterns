<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1620"/>
      <stop offset="1" stop-color="#132a36"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ee0c6"/>
      <stop offset="1" stop-color="#22b89f"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="#3ee0c6">FRONTEND PATTERNS · 08 · Example: Node.js + pino</text>
  <text x="70" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Bridge Pattern</text>
  <text x="70" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#a9c7c9">What you log and where it goes vary independently</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- АБСТРАКЦИИ (слева) -->
    <text x="220" y="308" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="2" fill="#7fb8bd">ABSTRACTION</text>
    <g filter="url(#shadow)">
      <rect x="70" y="330" width="300" height="60" rx="14" fill="#14303c" stroke="#3ee0c6" stroke-width="2"/>
      <rect x="70" y="405" width="300" height="60" rx="14" fill="#14303c" stroke="#3ee0c6" stroke-width="2"/>
      <rect x="70" y="480" width="300" height="60" rx="14" fill="#14303c" stroke="#3ee0c6" stroke-width="2"/>
    </g>
    <text x="220" y="367" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">Logger</text>
    <text x="220" y="442" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">RequestLogger</text>
    <text x="220" y="517" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">ErrorLogger</text>

    <!-- соединения абстракций с мостом -->
    <path d="M370 360 L528 395" stroke="#3ee0c6" stroke-width="4" fill="none"/>
    <path d="M370 435 L528 435" stroke="#3ee0c6" stroke-width="4" fill="none"/>
    <path d="M370 510 L528 475" stroke="#3ee0c6" stroke-width="4" fill="none"/>

    <!-- МОСТ: интерфейс LogWriter (в центре) -->
    <g filter="url(#glow)">
      <rect x="530" y="300" width="140" height="240" rx="18" fill="url(#bridge)"/>
    </g>
    <text x="600" y="368" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="1" fill="#0b1620">BRIDGE</text>
    <text x="600" y="412" text-anchor="middle" font-size="24" font-weight="700" fill="#0b1620">LogWriter</text>
    <text x="600" y="446" text-anchor="middle" font-size="20" font-family="Menlo, monospace" fill="#0b1620">write()</text>

    <!-- соединения моста с реализациями -->
    <path d="M672 395 L830 360" stroke="#3ee0c6" stroke-width="4" fill="none"/>
    <path d="M672 435 L830 435" stroke="#3ee0c6" stroke-width="4" fill="none"/>
    <path d="M672 475 L830 510" stroke="#3ee0c6" stroke-width="4" fill="none"/>

    <!-- РЕАЛИЗАЦИИ (справа) -->
    <text x="980" y="308" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="2" fill="#7fb8bd">IMPLEMENTATION</text>
    <g filter="url(#shadow)">
      <rect x="830" y="330" width="300" height="60" rx="14" fill="#14303c" stroke="#3ee0c6" stroke-width="2"/>
      <rect x="830" y="405" width="300" height="60" rx="14" fill="#14303c" stroke="#3ee0c6" stroke-width="2"/>
    </g>
    <rect x="830" y="480" width="300" height="60" rx="14" fill="#14303c" stroke="#3ee0c6" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="980" y="367" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">PinoWriter</text>
    <text x="980" y="442" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">ConsoleWriter</text>
    <text x="980" y="517" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">YourWriter</text>

    <!-- подпись -->
    <text x="70" y="600" font-size="22" fill="#a9c7c9">Add a writer, and every logger works with it. Add a logger, and every writer works with it.</text>
  </g>
</svg>
