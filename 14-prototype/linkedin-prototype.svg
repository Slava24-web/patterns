<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="#93c5fd">FRONTEND PATTERNS · 14 · Example: TypeScript + three.js</text>
  <text x="70" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Prototype Pattern</text>
  <text x="70" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#cbd5e1">Copy a configured object instead of building it again</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- прототип (слева) -->
    <g filter="url(#glow)">
      <rect x="70" y="320" width="280" height="110" rx="20" fill="url(#core)"/>
    </g>
    <text x="210" y="364" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">enemy prototype</text>
    <text x="210" y="400" text-anchor="middle" font-size="20" font-family="Menlo, monospace" fill="#0f172a">.clone()</text>

    <!-- заголовки колонок -->
    <text x="470" y="282" font-size="18" font-weight="600" letter-spacing="2" fill="#cbd5e1">COPIES</text>
    <text x="860" y="282" font-size="18" font-weight="600" letter-spacing="2" fill="#cbd5e1">SHARED BY REFERENCE</text>

    <!-- стрелки прототип -> копии -->
    <path d="M355 350 L462 321" stroke="#93c5fd" stroke-width="4" fill="none"/>
    <path d="M355 375 L462 401" stroke="#93c5fd" stroke-width="4" fill="none"/>
    <path d="M355 400 L462 481" stroke="#f87171" stroke-width="4" fill="none"/>

    <!-- копии -->
    <g filter="url(#shadow)">
      <rect x="470" y="300" width="300" height="62" rx="14" fill="#1e293b" stroke="#93c5fd" stroke-width="2"/>
      <rect x="470" y="380" width="300" height="62" rx="14" fill="#1e293b" stroke="#93c5fd" stroke-width="2"/>
      <rect x="470" y="460" width="300" height="62" rx="14" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
    </g>
    <text x="620" y="338" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">enemy copy · x = 1</text>
    <text x="620" y="418" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">enemy copy · x = 2</text>
    <text x="620" y="498" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">red copy · own material</text>

    <!-- общие ресурсы (справа) -->
    <g filter="url(#shadow)">
      <rect x="860" y="300" width="280" height="62" rx="14" fill="#172033" stroke="#64748b" stroke-width="2" stroke-dasharray="10 8"/>
      <rect x="860" y="380" width="280" height="62" rx="14" fill="#172033" stroke="#64748b" stroke-width="2" stroke-dasharray="10 8"/>
      <rect x="860" y="460" width="280" height="62" rx="14" fill="#172033" stroke="#f87171" stroke-width="2" stroke-dasharray="10 8"/>
    </g>
    <text x="1000" y="338" text-anchor="middle" font-size="20" font-family="Menlo, monospace" fill="#cbd5e1">BoxGeometry (all)</text>
    <text x="1000" y="418" text-anchor="middle" font-size="20" font-family="Menlo, monospace" fill="#cbd5e1">green material (1, 2)</text>
    <text x="1000" y="498" text-anchor="middle" font-size="20" font-family="Menlo, monospace" fill="#cbd5e1">red material (3)</text>

    <!-- связи копий с общими ресурсами -->
    <path d="M770 331 L858 331" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
    <path d="M770 411 L858 411" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
    <path d="M770 491 L858 491" stroke="#f87171" stroke-width="3" fill="none" stroke-dasharray="8 6"/>

    <!-- подпись -->
    <text x="70" y="598" font-size="22" fill="#cbd5e1">clone() copies the configured object; geometry and material are shared unless you clone them too.</text>
  </g>
</svg>
