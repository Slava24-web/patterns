<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1c2330"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="#cbd5e1">FRONTEND PATTERNS · 17 · Example: TypeScript + tsyringe</text>
  <text x="70" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Dependency Injection</text>
  <text x="70" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#94a3b8">The class receives its dependencies, it doesn't build them</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- контейнер (слева) -->
    <g filter="url(#shadow)">
      <rect x="70" y="320" width="270" height="110" rx="20" fill="#18202b" stroke="#cbd5e1" stroke-width="2"/>
    </g>
    <text x="205" y="364" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">container</text>
    <text x="205" y="400" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#cbd5e1">register(TOKEN, …)</text>

    <!-- стрелка: контейнер -> сервис -->
    <path d="M345 375 L418 375" stroke="#cbd5e1" stroke-width="4" fill="none"/>
    <path d="M418 363 L418 387 L432 375 Z" fill="#cbd5e1"/>
    <text x="382" y="352" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#94a3b8">injects</text>

    <!-- сервис (в центре) -->
    <g filter="url(#glow)">
      <rect x="440" y="320" width="260" height="110" rx="20" fill="url(#core)"/>
    </g>
    <text x="570" y="364" text-anchor="middle" font-size="26" font-weight="700" fill="#0d1117">OrderService</text>
    <text x="570" y="400" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#1c2330">constructor(payments)</text>

    <!-- стрелка к боевой реализации -->
    <path d="M700 352 L814 326" stroke="#cbd5e1" stroke-width="4" fill="none"/>
    <path d="M822 323 L806 317 L808 337 Z" fill="#cbd5e1"/>
    <text x="745" y="320" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#94a3b8">app</text>

    <!-- стрелка к заглушке -->
    <path d="M700 395 L812 460" stroke="#94a3b8" stroke-width="4" fill="none" stroke-dasharray="10 8"/>
    <path d="M812 472 L808 446 L824 458 Z" fill="#94a3b8"/>
    <text x="745" y="448" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#94a3b8">tests</text>

    <!-- реализации (справа) -->
    <g filter="url(#shadow)">
      <rect x="830" y="296" width="300" height="80" rx="16" fill="#18202b" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="830" y="440" width="300" height="80" rx="16" fill="#18202b" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/>
    </g>
    <text x="980" y="330" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">RealPaymentGateway</text>
    <text x="980" y="360" text-anchor="middle" font-size="18" fill="#cbd5e1">production</text>
    <text x="980" y="474" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">FakePaymentGateway</text>
    <text x="980" y="504" text-anchor="middle" font-size="18" fill="#cbd5e1">test double</text>

    <!-- карточка -->
    <rect x="70" y="540" width="1060" height="44" rx="14" fill="#18202b" stroke="#475569" stroke-width="2"/>
    <text x="100" y="568" font-size="20" fill="#cbd5e1">The container picks the implementation. OrderService and its tests change nothing.</text>

    <!-- подпись -->
    <text x="70" y="614" font-size="22" fill="#94a3b8">Swap the registration to change the dependency; the class that uses it stays the same.</text>
  </g>
</svg>
