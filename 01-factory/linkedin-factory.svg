<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#38bdf8">FRONTEND PATTERNS · 01 · Example: React</text>
  <text x="70" y="190" font-family="Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#f8fafc">Factory Pattern</text>
  <text x="70" y="245" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#94a3b8">Data in, the right component out</text>

  <!-- Схема: config -> FieldFactory -> компонент -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- config -->
    <rect x="70" y="320" width="270" height="150" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="205" y="365" text-anchor="middle" font-size="24" fill="#94a3b8">config</text>
    <text x="205" y="410" text-anchor="middle" font-size="21" font-family="Menlo, monospace" fill="#f8fafc">{ type: 'email' }</text>
    <text x="205" y="445" text-anchor="middle" font-size="21" font-family="Menlo, monospace" fill="#f8fafc">{ type: 'select' }</text>

    <!-- стрелка -->
    <path d="M360 395 L450 395" stroke="#38bdf8" stroke-width="4"/>

    <!-- фабрика -->
    <rect x="460" y="330" width="260" height="130" rx="18" fill="#0ea5e9"/>
    <text x="590" y="385" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">FieldFactory</text>
    <text x="590" y="425" text-anchor="middle" font-size="22" fill="#0f172a">switch (config.type)</text>

    <!-- стрелка -->
    <path d="M730 395 L820 395" stroke="#38bdf8" stroke-width="4"/>

    <!-- компоненты -->
    <rect x="830" y="320" width="300" height="60" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="980" y="359" text-anchor="middle" font-size="24" fill="#f8fafc">TextField</text>
    <rect x="830" y="395" width="300" height="60" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="980" y="434" text-anchor="middle" font-size="24" fill="#f8fafc">SelectField</text>
    <rect x="830" y="470" width="300" height="60" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="980" y="509" text-anchor="middle" font-size="24" fill="#f8fafc">YourField</text>
  </g>

  <!-- Футер -->
</svg>
