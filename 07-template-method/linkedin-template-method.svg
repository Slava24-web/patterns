<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12101b"/>
      <stop offset="1" stop-color="#1e1a30"/>
    </linearGradient>
    <linearGradient id="skeleton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2350"/>
      <stop offset="1" stop-color="#221d42"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="#a78bfa">FRONTEND PATTERNS · 07 · Example: TypeScript + axios</text>
  <text x="70" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Template Method</text>
  <text x="70" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#b9b3d6">Fixed skeleton in the base, steps in subclasses</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- базовый класс: скелет -->
    <g filter="url(#shadow)">
      <rect x="70" y="290" width="1060" height="150" rx="20" fill="url(#skeleton)" stroke="#a78bfa" stroke-width="2"/>
    </g>
    <text x="100" y="326" font-size="22" font-weight="600" letter-spacing="1" fill="#a78bfa">ApiLoader.load()  ·  FIXED ORDER</text>

    <!-- шаги скелета -->
    <rect x="100" y="345" width="300" height="72" rx="14" fill="#171426" stroke="#5b4a9e" stroke-width="2"/>
    <text x="250" y="376" text-anchor="middle" font-size="26" font-weight="700" font-family="Menlo, monospace" fill="#ffffff">endpoint()</text>
    <text x="250" y="402" text-anchor="middle" font-size="17" fill="#9d94c4">abstract, subclass</text>

    <rect x="450" y="345" width="300" height="72" rx="14" fill="#171426" stroke="#5b4a9e" stroke-width="2"/>
    <text x="600" y="376" text-anchor="middle" font-size="26" font-weight="700" font-family="Menlo, monospace" fill="#ffffff">parse()</text>
    <text x="600" y="402" text-anchor="middle" font-size="17" fill="#9d94c4">abstract, subclass</text>

    <rect x="800" y="345" width="300" height="72" rx="14" fill="#171426" stroke="#5b4a9e" stroke-width="2"/>
    <text x="950" y="376" text-anchor="middle" font-size="26" font-weight="700" font-family="Menlo, monospace" fill="#ffffff">onError()</text>
    <text x="950" y="402" text-anchor="middle" font-size="17" fill="#9d94c4">hook, default rethrows</text>

    <path d="M400 381 L445 381" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M750 381 L795 381" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

    <!-- подклассы: заполняют шаги -->
    <path d="M230 490 L230 442" stroke="#a78bfa" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
    <path d="M600 490 L600 442" stroke="#a78bfa" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
    <path d="M970 490 L970 442" stroke="#a78bfa" stroke-width="3" fill="none" stroke-dasharray="8 6"/>

    <g filter="url(#shadow)">
      <rect x="70" y="490" width="320" height="80" rx="18" fill="#1d1a2e" stroke="#7c5cff" stroke-width="2"/>
      <rect x="440" y="490" width="320" height="80" rx="18" fill="#1d1a2e" stroke="#7c5cff" stroke-width="2"/>
      <rect x="810" y="490" width="320" height="80" rx="18" fill="#1d1a2e" stroke="#7c5cff" stroke-width="2" stroke-dasharray="10 8"/>
    </g>
    <text x="230" y="524" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">UsersLoader</text>
    <text x="230" y="551" text-anchor="middle" font-size="17" fill="#9d94c4">overrides endpoint, parse</text>

    <text x="600" y="524" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">PostsLoader</text>
    <text x="600" y="551" text-anchor="middle" font-size="17" fill="#9d94c4">overrides parse, onError</text>

    <text x="970" y="524" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">YourLoader</text>
    <text x="970" y="551" text-anchor="middle" font-size="17" fill="#9d94c4">any new source</text>

    <text x="70" y="608" font-size="22" fill="#b9b3d6">The base class decides the order of steps. Subclasses only fill in the steps.</text>
  </g>
</svg>
