<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001e2b"/>
      <stop offset="1" stop-color="#03303f"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4af59a"/>
      <stop offset="1" stop-color="#00ed64"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="#00ed64">FRONTEND PATTERNS · 13 · Example: TypeScript + mongoose</text>
  <text x="70" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Builder Pattern</text>
  <text x="70" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#a6c9d2">Build a complex query one step at a time</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- шаги строителя (верхний ряд) -->
    <text x="70" y="300" font-size="20" font-weight="600" letter-spacing="2" fill="#a6c9d2">STEPS · EACH RETURNS THE BUILDER</text>

    <g filter="url(#shadow)">
      <rect x="70" y="320" width="185" height="80" rx="16" fill="#0b2a36" stroke="#00ed64" stroke-width="2"/>
      <rect x="275" y="320" width="185" height="80" rx="16" fill="#0b2a36" stroke="#00ed64" stroke-width="2"/>
      <rect x="480" y="320" width="185" height="80" rx="16" fill="#0b2a36" stroke="#00ed64" stroke-width="2"/>
      <rect x="685" y="320" width="185" height="80" rx="16" fill="#0b2a36" stroke="#00ed64" stroke-width="2"/>
      <rect x="890" y="320" width="185" height="80" rx="16" fill="#0b2a36" stroke="#00ed64" stroke-width="2"/>
    </g>
    <text x="162" y="368" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#ffffff">.withStatus()</text>
    <text x="367" y="368" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#ffffff">.minTotal()</text>
    <text x="572" y="368" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#ffffff">.createdAfter()</text>
    <text x="777" y="368" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#ffffff">.newestFirst()</text>
    <text x="982" y="368" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#ffffff">.limit()</text>

    <!-- стрелка вниз к build: линия и наконечник с зазором до блока -->
    <path d="M982 404 L982 430" stroke="#00ed64" stroke-width="4" fill="none"/>
    <path d="M970 430 L994 430 L982 446 Z" fill="#00ed64"/>

    <!-- build() -->
    <g filter="url(#glow)">
      <rect x="890" y="450" width="185" height="80" rx="16" fill="url(#core)"/>
    </g>
    <text x="982" y="498" text-anchor="middle" font-size="24" font-weight="700" font-family="Menlo, monospace" fill="#001e2b">.build()</text>

    <!-- стрелка влево к результату: линия и наконечник с зазором до блока -->
    <path d="M880 490 L728 490" stroke="#00ed64" stroke-width="4" fill="none"/>
    <path d="M728 478 L728 502 L712 490 Z" fill="#00ed64"/>

    <!-- результат -->
    <g filter="url(#shadow)">
      <rect x="470" y="450" width="230" height="80" rx="16" fill="#0b2a36" stroke="#00ed64" stroke-width="2" stroke-dasharray="10 8"/>
    </g>
    <text x="585" y="484" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Finished result</text>
    <text x="585" y="514" text-anchor="middle" font-size="19" fill="#a6c9d2">one MongoDB query</text>

    <!-- подпись -->
    <text x="70" y="598" font-size="22" fill="#a6c9d2">Add only the conditions you need, in any order. build() returns the finished object.</text>
  </g>
</svg>
