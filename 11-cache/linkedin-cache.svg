<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170f11"/>
      <stop offset="1" stop-color="#2a1619"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b78"/>
      <stop offset="1" stop-color="#ff4154"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff4154"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="#ff6b78">FRONTEND PATTERNS · 11 · Example: React + TanStack Query</text>
  <text x="70" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Cache Pattern</text>
  <text x="70" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#d8b4b7">Keep server data by key, reuse it while fresh</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- компонент (слева) -->
    <g filter="url(#shadow)">
      <rect x="70" y="390" width="280" height="110" rx="20" fill="#2e1a1d" stroke="#ff4154" stroke-width="2"/>
    </g>
    <text x="210" y="434" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">ProductCard</text>
    <text x="210" y="470" text-anchor="middle" font-size="20" font-family="Menlo, monospace" fill="#d8b4b7">useQuery()</text>

    <!-- стрелка к кэшу: read -->
    <path d="M350 420 L455 355" stroke="#ff4154" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="355" y="352" text-anchor="end" font-size="20" font-family="Menlo, monospace" fill="#ff6b78">1 · read</text>

    <!-- стрелка к серверу: fetch when stale -->
    <path d="M350 480 L455 520" stroke="#ff4154" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="385" y="562" text-anchor="end" font-size="20" font-family="Menlo, monospace" fill="#ff6b78">2 · fetch</text>

    <!-- кэш (сверху в центре) -->
    <rect x="460" y="290" width="300" height="110" rx="20" fill="#2e1a1d" stroke="#ff4154" stroke-width="2"/>
    <text x="610" y="334" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Query cache</text>
    <text x="610" y="370" text-anchor="middle" font-size="20" font-family="Menlo, monospace" fill="#d8b4b7">['product', 'coffee']</text>

    <!-- сервер (снизу в центре) -->
    <rect x="460" y="480" width="300" height="100" rx="20" fill="#2e1a1d" stroke="#ff4154" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="610" y="524" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Server</text>
    <text x="610" y="558" text-anchor="middle" font-size="20" fill="#d8b4b7">source of truth</text>

    <!-- легенда (справа) -->
    <g filter="url(#glow)">
      <rect x="820" y="290" width="310" height="290" rx="22" fill="url(#core)"/>
    </g>
    <text x="850" y="336" font-size="22" font-weight="700" letter-spacing="1" fill="#2a0b0e">READ</text>
    <text x="850" y="372" font-size="22" fill="#2a0b0e">fresh: from cache</text>
    <text x="850" y="408" font-size="22" fill="#2a0b0e">stale or empty: fetch</text>
    <text x="850" y="444" font-size="22" fill="#2a0b0e">store under the key</text>
    <text x="850" y="500" font-size="22" font-weight="700" letter-spacing="1" fill="#2a0b0e">WRITE</text>
    <text x="850" y="536" font-size="22" fill="#2a0b0e">mutate, then invalidate</text>

    <!-- подпись -->
    <text x="70" y="612" font-size="22" fill="#d8b4b7">The library keeps the cache and refetches only what is stale or invalidated.</text>
  </g>
</svg>
