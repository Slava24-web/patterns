<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#14203a"/>
    </linearGradient>
    <linearGradient id="composite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f7af0"/>
      <stop offset="1" stop-color="#2f62d6"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="#6fa3ff">FRONTEND PATTERNS · 09 · Example: TypeScript + zod</text>
  <text x="70" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Composite Pattern</text>
  <text x="70" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#b3c3e0">Leaves and groups share one interface</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- связи -->
    <path d="M600 342 L235 380" stroke="#6fa3ff" stroke-width="4" fill="none"/>
    <path d="M600 342 L600 380" stroke="#6fa3ff" stroke-width="4" fill="none"/>
    <path d="M595 452 L490 490" stroke="#6fa3ff" stroke-width="4" fill="none"/>
    <path d="M595 452 L700 490" stroke="#6fa3ff" stroke-width="4" fill="none"/>

    <!-- корень: композит -->
    <g filter="url(#glow)">
      <rect x="440" y="270" width="320" height="72" rx="18" fill="url(#composite)"/>
    </g>
    <text x="600" y="302" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Cart · Bundle</text>
    <text x="600" y="330" text-anchor="middle" font-size="20" font-family="Menlo, monospace" fill="#e3ecff">price() = $8.15</text>

    <!-- лист: Кофе -->
    <g filter="url(#shadow)">
      <rect x="110" y="380" width="250" height="72" rx="16" fill="#111a2b" stroke="#6fa3ff" stroke-width="2"/>
    </g>
    <text x="235" y="412" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Coffee · Product</text>
    <text x="235" y="440" text-anchor="middle" font-size="20" font-family="Menlo, monospace" fill="#b3c3e0">$5.00</text>

    <!-- композит: Завтрак -->
    <g filter="url(#shadow)">
      <rect x="470" y="380" width="250" height="72" rx="16" fill="#1d2c4f" stroke="#6fa3ff" stroke-width="3"/>
    </g>
    <text x="595" y="412" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Breakfast · −10%</text>
    <text x="595" y="440" text-anchor="middle" font-size="20" font-family="Menlo, monospace" fill="#b3c3e0">$3.15</text>

    <!-- листья внутри Завтрака -->
    <g filter="url(#shadow)">
      <rect x="400" y="490" width="180" height="72" rx="16" fill="#111a2b" stroke="#6fa3ff" stroke-width="2"/>
      <rect x="610" y="490" width="180" height="72" rx="16" fill="#111a2b" stroke="#6fa3ff" stroke-width="2"/>
    </g>
    <text x="490" y="522" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Croissant</text>
    <text x="490" y="550" text-anchor="middle" font-size="19" font-family="Menlo, monospace" fill="#b3c3e0">$1.50</text>
    <text x="700" y="522" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Juice</text>
    <text x="700" y="550" text-anchor="middle" font-size="19" font-family="Menlo, monospace" fill="#b3c3e0">$2.00</text>

    <!-- подпись -->
    <text x="70" y="604" font-size="22" fill="#b3c3e0">Leaves and bundles share price(). The parent sums its children, whatever they are.</text>
  </g>
</svg>
