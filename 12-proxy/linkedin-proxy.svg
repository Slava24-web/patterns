<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a120c"/>
      <stop offset="1" stop-color="#2b1e13"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb37a"/>
      <stop offset="1" stop-color="#ff9955"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff9955"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="#ffb37a">FRONTEND PATTERNS · 12 · Example: TypeScript + MobX</text>
  <text x="70" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Proxy Pattern</text>
  <text x="70" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#e3cbb4">Same data through a guard, live as it changes</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- клиент (слева) -->
    <g filter="url(#shadow)">
      <rect x="70" y="300" width="280" height="110" rx="20" fill="#2e2014" stroke="#ff9955" stroke-width="2"/>
    </g>
    <text x="210" y="344" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Client</text>
    <text x="210" y="380" text-anchor="middle" font-size="20" font-family="Menlo, monospace" fill="#e3cbb4">add() · total</text>

    <!-- стрелка клиент -> прокси -->
    <path d="M355 355 L452 355" stroke="#ff9955" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

    <!-- прокси (в центре) -->
    <g filter="url(#glow)">
      <rect x="460" y="300" width="300" height="110" rx="20" fill="url(#core)"/>
    </g>
    <text x="610" y="344" text-anchor="middle" font-size="26" font-weight="700" fill="#2b1407">RoleCartProxy</text>
    <text x="610" y="380" text-anchor="middle" font-size="20" font-family="Menlo, monospace" fill="#2b1407">viewer | buyer</text>

    <!-- стрелка прокси -> хранилище -->
    <path d="M765 355 L842 355" stroke="#ff9955" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

    <!-- хранилище MobX (справа) -->
    <g filter="url(#shadow)">
      <rect x="850" y="300" width="280" height="110" rx="20" fill="#2e2014" stroke="#ff9955" stroke-width="2" stroke-dasharray="10 8"/>
    </g>
    <text x="990" y="344" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">CartStore</text>
    <text x="990" y="380" text-anchor="middle" font-size="20" font-family="Menlo, monospace" fill="#e3cbb4">MobX observable</text>

    <!-- карточки: роли и реактивность -->
    <rect x="70" y="450" width="340" height="130" rx="18" fill="#2e2014" stroke="#ff9955" stroke-width="2"/>
    <text x="100" y="490" font-size="24" font-weight="700" letter-spacing="1" fill="#ffb37a">READ</text>
    <text x="100" y="524" font-size="21" fill="#f5e6d6">live values pass through</text>
    <text x="100" y="554" font-size="21" fill="#f5e6d6">the proxy unchanged</text>

    <rect x="430" y="450" width="340" height="130" rx="18" fill="#2e2014" stroke="#ff9955" stroke-width="2"/>
    <text x="460" y="490" font-size="24" font-weight="700" letter-spacing="1" fill="#ffb37a">WRITE</text>
    <text x="460" y="524" font-size="21" fill="#f5e6d6">buyer: add goes through</text>
    <text x="460" y="554" font-size="21" fill="#f5e6d6">viewer: the proxy throws</text>

    <rect x="790" y="450" width="340" height="130" rx="18" fill="#2e2014" stroke="#ff9955" stroke-width="2"/>
    <text x="820" y="490" font-size="24" font-weight="700" letter-spacing="1" fill="#ffb37a">REACTIVE</text>
    <text x="820" y="524" font-size="21" fill="#f5e6d6">autorun and observer see</text>
    <text x="820" y="554" font-size="21" fill="#f5e6d6">each change through the proxy</text>

    <!-- подпись -->
    <text x="70" y="612" font-size="22" fill="#e3cbb4">The proxy guards writes, while reads stay live from the MobX store.</text>
  </g>
</svg>
