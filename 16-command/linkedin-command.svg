<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11122a"/>
      <stop offset="1" stop-color="#1e1f45"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="#a5b4fc">FRONTEND PATTERNS · 16 · Example: TypeScript + commander</text>
  <text x="70" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Command Pattern</text>
  <text x="70" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#c7cbe8">An action as an object, with execute and undo</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- CLI (слева) -->
    <g filter="url(#shadow)">
      <rect x="70" y="320" width="270" height="110" rx="20" fill="#1c1d42" stroke="#818cf8" stroke-width="2"/>
    </g>
    <text x="205" y="364" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">commander</text>
    <text x="205" y="400" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#c7cbe8">note append 'world'</text>

    <!-- стрелка CLI -> история -->
    <path d="M345 375 L418 375" stroke="#818cf8" stroke-width="4" fill="none"/>
    <path d="M418 363 L418 387 L432 375 Z" fill="#818cf8"/>
    <text x="382" y="352" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#c7cbe8">run</text>

    <!-- история команд (в центре) -->
    <g filter="url(#glow)">
      <rect x="440" y="300" width="300" height="150" rx="20" fill="url(#core)"/>
    </g>
    <text x="590" y="336" text-anchor="middle" font-size="24" font-weight="700" fill="#1e1b4b">CommandHistory</text>
    <rect x="462" y="352" width="256" height="40" rx="10" fill="#1e1b4b"/>
    <text x="590" y="378" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#e0e7ff">DeleteLastCommand</text>
    <rect x="462" y="400" width="256" height="40" rx="10" fill="#1e1b4b"/>
    <text x="590" y="426" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#e0e7ff">AppendCommand('world')</text>

    <!-- стрелка история -> документ -->
    <path d="M745 375 L818 375" stroke="#818cf8" stroke-width="4" fill="none"/>
    <path d="M818 363 L818 387 L832 375 Z" fill="#818cf8"/>
    <text x="782" y="352" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#c7cbe8">execute</text>

    <!-- документ (справа) -->
    <g filter="url(#shadow)">
      <rect x="840" y="320" width="290" height="110" rx="20" fill="#1c1d42" stroke="#818cf8" stroke-width="2" stroke-dasharray="10 8"/>
    </g>
    <text x="985" y="364" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Document</text>
    <text x="985" y="400" text-anchor="middle" font-size="18" font-family="Menlo, monospace" fill="#c7cbe8">text: 'Hello world'</text>

    <!-- карточки: правила -->
    <rect x="70" y="470" width="340" height="110" rx="18" fill="#1c1d42" stroke="#818cf8" stroke-width="2"/>
    <text x="100" y="508" font-size="24" font-weight="700" letter-spacing="1" fill="#a5b4fc">EXECUTE</text>
    <text x="100" y="540" font-size="21" fill="#e0e7ff">each command changes</text>
    <text x="100" y="566" font-size="21" fill="#e0e7ff">the document itself</text>

    <rect x="430" y="470" width="340" height="110" rx="18" fill="#1c1d42" stroke="#818cf8" stroke-width="2"/>
    <text x="460" y="508" font-size="24" font-weight="700" letter-spacing="1" fill="#a5b4fc">UNDO</text>
    <text x="460" y="540" font-size="21" fill="#e0e7ff">pop the last command</text>
    <text x="460" y="566" font-size="21" fill="#e0e7ff">and call its undo()</text>

    <rect x="790" y="470" width="340" height="110" rx="18" fill="#1c1d42" stroke="#818cf8" stroke-width="2"/>
    <text x="820" y="508" font-size="24" font-weight="700" letter-spacing="1" fill="#a5b4fc">STACK</text>
    <text x="820" y="540" font-size="21" fill="#e0e7ff">history keeps command objects</text>
    <text x="820" y="566" font-size="21" fill="#e0e7ff">instead of text copies</text>

    <!-- подпись -->
    <text x="70" y="612" font-size="22" fill="#c7cbe8">Each action is an object, so it can be stored, replayed, and reverted.</text>
  </g>
</svg>
