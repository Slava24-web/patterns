<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1020"/>
      <stop offset="1" stop-color="#2e1630"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbcfe8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="#f472b6">FRONTEND PATTERNS · 15 · Example: TypeScript + Express</text>
  <text x="70" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Chain of Responsibility</text>
  <text x="70" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#e9c9dc">Each link answers or passes the request on</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="70" y="292" font-size="18" font-weight="600" letter-spacing="2" fill="#e9c9dc">ROUTE ORDER DEFINES THE CHAIN</text>

    <!-- входящий запрос -->
    <g filter="url(#shadow)">
      <rect x="70" y="320" width="140" height="90" rx="16" fill="#3a1d3f" stroke="#e9c9dc" stroke-width="2"/>
    </g>
    <text x="140" y="362" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">request</text>
    <text x="140" y="390" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#e9c9dc">POST /orders</text>

    <!-- стрелки между звеньями -->
    <path d="M210 365 L262 365" stroke="#f472b6" stroke-width="4" fill="none"/>
    <path d="M262 353 L262 377 L274 365 Z" fill="#f472b6"/>
    <path d="M470 365 L522 365" stroke="#f472b6" stroke-width="4" fill="none"/>
    <path d="M522 353 L522 377 L534 365 Z" fill="#f472b6"/>
    <path d="M730 365 L782 365" stroke="#f472b6" stroke-width="4" fill="none"/>
    <path d="M782 353 L782 377 L794 365 Z" fill="#f472b6"/>

    <!-- звено 1: авторизация -->
    <g filter="url(#shadow)">
      <rect x="290" y="320" width="180" height="90" rx="16" fill="#3a1d3f" stroke="#f472b6" stroke-width="2"/>
    </g>
    <text x="380" y="360" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">authenticate</text>
    <text x="380" y="390" text-anchor="middle" font-size="18" fill="#e9c9dc">token ok?</text>

    <!-- звено 2: валидация -->
    <g filter="url(#shadow)">
      <rect x="530" y="320" width="200" height="90" rx="16" fill="#3a1d3f" stroke="#f472b6" stroke-width="2"/>
    </g>
    <text x="630" y="360" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">validateOrder</text>
    <text x="630" y="390" text-anchor="middle" font-size="18" fill="#e9c9dc">body ok?</text>

    <!-- звено 3: создание -->
    <g filter="url(#glow)">
      <rect x="790" y="320" width="200" height="90" rx="16" fill="url(#core)"/>
    </g>
    <text x="890" y="360" text-anchor="middle" font-size="24" font-weight="700" fill="#2e1630">createOrder</text>
    <text x="890" y="390" text-anchor="middle" font-size="18" fill="#2e1630">handles the request</text>

    <!-- выходы при отказе: ответ и обрыв цепочки -->
    <path d="M380 410 L380 448" stroke="#fb7185" stroke-width="4" fill="none"/>
    <path d="M372 446 L388 446 L380 460 Z" fill="#fb7185"/>
    <path d="M630 410 L630 448" stroke="#fb7185" stroke-width="4" fill="none"/>
    <path d="M622 446 L638 446 L630 460 Z" fill="#fb7185"/>
    <path d="M890 410 L890 448" stroke="#f472b6" stroke-width="4" fill="none"/>
    <path d="M882 446 L898 446 L890 460 Z" fill="#f472b6"/>

    <g filter="url(#shadow)">
      <rect x="290" y="465" width="180" height="80" rx="16" fill="#2e1630" stroke="#fb7185" stroke-width="2" stroke-dasharray="10 8"/>
      <rect x="530" y="465" width="200" height="80" rx="16" fill="#2e1630" stroke="#fb7185" stroke-width="2" stroke-dasharray="10 8"/>
      <rect x="790" y="465" width="200" height="80" rx="16" fill="#2e1630" stroke="#f472b6" stroke-width="2"/>
    </g>
    <text x="380" y="500" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">401 · no token</text>
    <text x="380" y="530" text-anchor="middle" font-size="18" fill="#e9c9dc">chain stops here</text>
    <text x="630" y="500" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">400 invalid</text>
    <text x="630" y="530" text-anchor="middle" font-size="18" fill="#e9c9dc">chain stops here</text>
    <text x="890" y="500" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">201 created</text>
    <text x="890" y="530" text-anchor="middle" font-size="18" fill="#e9c9dc">response sent</text>

    <!-- подпись -->
    <text x="70" y="598" font-size="22" fill="#e9c9dc">A link either sends a response or calls next() to pass the request further along the chain.</text>
  </g>
</svg>
