<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17132b"/>
      <stop offset="1" stop-color="#2a2150"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f5fd6"/>
      <stop offset="1" stop-color="#764abc"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="#b794f4">FRONTEND PATTERNS · 04 · Example: Redux</text>
  <text x="70" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Singleton Pattern</text>
  <text x="70" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#c4b5e0">One store instance, shared by everything</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- компоненты (слева) -->
    <g filter="url(#shadow)">
      <rect x="70" y="320" width="300" height="60" rx="14" fill="#241d3f" stroke="#5b4a8f" stroke-width="2"/>
      <rect x="70" y="395" width="300" height="60" rx="14" fill="#241d3f" stroke="#5b4a8f" stroke-width="2"/>
      <rect x="70" y="470" width="300" height="60" rx="14" fill="#241d3f" stroke="#5b4a8f" stroke-width="2"/>
    </g>
    <text x="220" y="359" text-anchor="middle" font-size="24" fill="#ffffff">Counter</text>
    <text x="220" y="434" text-anchor="middle" font-size="24" fill="#ffffff">CounterLabel</text>
    <text x="220" y="509" text-anchor="middle" font-size="24" fill="#ffffff">YourComponent</text>

    <!-- стрелки от компонентов к store -->
    <path d="M370 350 L455 395" stroke="#b794f4" stroke-width="4" fill="none"/>
    <path d="M370 425 L455 425" stroke="#b794f4" stroke-width="4" fill="none"/>
    <path d="M370 500 L455 455" stroke="#b794f4" stroke-width="4" fill="none"/>

    <!-- store: единственный экземпляр (в центре) -->
    <g filter="url(#glow)">
      <rect x="460" y="330" width="280" height="190" rx="22" fill="url(#core)"/>
    </g>
    <rect x="460" y="330" width="280" height="190" rx="22" fill="none" stroke="#e9d8fd" stroke-width="2" stroke-opacity="0.5"/>
    <text x="600" y="375" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="2" fill="#e9d8fd">ONE INSTANCE</text>
    <text x="600" y="425" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">store</text>
    <text x="600" y="465" text-anchor="middle" font-size="22" font-family="Menlo, monospace" fill="#f3ebff">configureStore()</text>
    <text x="600" y="500" text-anchor="middle" font-size="20" fill="#e9d8fd">module-level, created once</text>

    <!-- стрелка store -> state -->
    <path d="M750 425 L835 425" stroke="#b794f4" stroke-width="4" fill="none"/>

    <!-- состояние (справа) -->
    <g filter="url(#shadow)">
      <rect x="840" y="350" width="290" height="150" rx="18" fill="#241d3f" stroke="#5b4a8f" stroke-width="2"/>
    </g>
    <text x="985" y="392" text-anchor="middle" font-size="24" fill="#c4b5e0">state</text>
    <text x="985" y="435" text-anchor="middle" font-size="21" font-family="Menlo, monospace" fill="#ffffff">counter: { value }</text>
    <text x="985" y="472" text-anchor="middle" font-size="21" font-family="Menlo, monospace" fill="#ffffff">getState()</text>
  </g>
</svg>
