<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3e50"/>
      <stop offset="1" stop-color="#35495e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- Заголовок -->
  <text x="70" y="110" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#42b883">FRONTEND PATTERNS · 02 · Example: Vue.js</text>
  <text x="70" y="190" font-family="Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Observer Pattern</text>
  <text x="70" y="245" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#b8c4cf">One change, many subscribers notified</text>

  <!-- Схема: Subject -> notify -> наблюдатели -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- subject -->
    <rect x="70" y="320" width="270" height="150" rx="18" fill="#35495e" stroke="#42b883" stroke-width="2"/>
    <text x="205" y="365" text-anchor="middle" font-size="24" fill="#b8c4cf">Subject</text>
    <text x="205" y="410" text-anchor="middle" font-size="21" font-family="Menlo, monospace" fill="#ffffff">subscribe()</text>
    <text x="205" y="445" text-anchor="middle" font-size="21" font-family="Menlo, monospace" fill="#ffffff">notify()</text>

    <!-- стрелка -->
    <path d="M360 395 L450 395" stroke="#42b883" stroke-width="4"/>

    <!-- оповещение -->
    <rect x="460" y="330" width="260" height="130" rx="18" fill="#42b883"/>
    <text x="590" y="385" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2d3d">cart.notify()</text>
    <text x="590" y="425" text-anchor="middle" font-size="22" fill="#1f2d3d">list changed</text>

    <!-- стрелка -->
    <path d="M730 395 L820 395" stroke="#42b883" stroke-width="4"/>

    <!-- наблюдатели -->
    <rect x="830" y="320" width="300" height="60" rx="14" fill="#35495e" stroke="#42b883" stroke-width="2"/>
    <text x="980" y="359" text-anchor="middle" font-size="24" fill="#ffffff">Badge counter</text>
    <rect x="830" y="395" width="300" height="60" rx="14" fill="#35495e" stroke="#42b883" stroke-width="2"/>
    <text x="980" y="434" text-anchor="middle" font-size="24" fill="#ffffff">Event log</text>
    <rect x="830" y="470" width="300" height="60" rx="14" fill="#35495e" stroke="#42b883" stroke-width="2"/>
    <text x="980" y="509" text-anchor="middle" font-size="24" fill="#ffffff">YourObserver</text>
  </g>
</svg>
